// STEPS 3-4 — The internal gRPC service (compile with make gen-proto).
//
//   * every RPC has its OWN request and response message
//   * streams carry a variable number of items
//   * errors are gRPC status codes, not fields in the messages
//   * RPCs need not map 1:1 to REST operations
syntax = "proto3";
package game.v1;
import "google/protobuf/field_mask.proto";
option go_package = "github.com/KareemAraide/distributed-systems-41/gen/game/v1;gamev1";

service GameService {
  rpc CreateGame(CreateGameRequest) returns (CreateGameResponse);
  // One ID and several IDs use the same RPC. The mask selects public fields.
  rpc GetGames(GetGamesRequest) returns (stream GetGamesResponse);
  rpc GetHand(GetHandRequest) returns (stream GetHandResponse);
  // One action or a whole batch: always one queued command.
  rpc ApplyActions(ApplyActionsRequest) returns (ApplyActionsResponse);
}
enum GamePhase {
  GAME_PHASE_UNSPECIFIED = 0;
  GAME_PHASE_WAITING = 1;
  GAME_PHASE_READY = 2;
  reserved 3; // former cutting phase
  GAME_PHASE_BIDDING = 4;
  GAME_PHASE_PLAYING = 5;
  GAME_PHASE_FINISHED = 6;
}
enum DealStatus {
  DEAL_STATUS_UNSPECIFIED = 0;
  reserved 1;
  DEAL_STATUS_BIDDING = 2;
  DEAL_STATUS_PLAYING = 3;
  DEAL_STATUS_SKIPPED = 4;
  DEAL_STATUS_COMPLETED = 5;
}
// Public state. Hands never appear in this message.
message Game {
  string id = 1;
  GamePhase phase = 2;
  int32 dealer_seat = 3;
  repeated Player players = 4; // seat order
  bool draw = 5;
  Deal current_deal = 6;
  optional int32 winner_team = 7;
}
message Player {
  string id = 1;
  string name = 2;
  int32 seat = 3;
  int32 team = 4;
  int64 score = 5;
  int32 minimum_bid = 6;
}
message Deal {
  int64 number = 1;
  DealStatus status = 2;
  int32 dealer_seat = 3;
  optional int32 next_seat = 4;
  reserved 5; // cut_position
  repeated Bid bids = 6;
  repeated DealPlayerState player_states = 7;
  int32 completed_tricks = 8;
  Trick current_trick = 9;
  Trick last_trick = 10;
}
message DealPlayerState { string player_id = 1; int32 cards_remaining = 2; int32 tricks_won = 3; }
message Bid { string player_id = 1; int32 amount = 2; int32 points = 3; }
message Trick {
  int32 number = 1;
  int32 leader_seat = 2;
  repeated CardPlay plays = 3;
  optional int32 winner_seat = 4;
}
message CardPlay { string player_id = 1; string card = 2; }
message CreateGameRequest { string name = 1; }
message CreateGameResponse { Game game = 1; string node_id = 2; }
message GetGamesRequest {
  repeated string game_ids = 1; // 1-100 distinct IDs, in result order
  reserved 2;
  google.protobuf.FieldMask read_mask = 3;
}
message GetGamesResponse {
  Game game = 1;
  string node_id = 2;
  bool fin = 3; // terminal message carries no game
}
message GetHandRequest { string game_id = 1; string player_id = 2; reserved 3; }
message GetHandResponse {
  oneof item { HandInfo info = 1; string card = 2; }
  bool fin = 3; // metadata, zero or more cards, then a fin-only message
}
message HandInfo {
  string game_id = 1;
  int64 deal_number = 2;
  string player_id = 3;
  string node_id = 4;
}
message GameAction {
  string game_id = 1;
  oneof action {
    JoinAction join = 2;
    StartDealAction start_deal = 3;
    BidAction bid = 4;
    PlayAction play = 5;
  }
}
message JoinAction { string name = 1; int32 seat = 2; }
message StartDealAction { string player_id = 1; }
message BidAction { string player_id = 1; int64 deal_number = 2; int32 amount = 3; }
message PlayAction { string player_id = 1; int64 deal_number = 2; string card = 3; }
message ApplyActionsRequest { repeated GameAction actions = 1; } // 1-100
message ApplyActionsResponse {
  repeated Game games = 1; // detached snapshot after each action, in request order
  string node_id = 2;
}
