openapi: 3.0.3
# ---------------------------------------------------------------------------
# STEP 1 — Service semantics as an OpenAPI document.
#
# Edit this file in the Swagger Editor (/editor once the server runs, or
# https://editor.swagger.io) and fix every warning. Then `make gen-rest`.
#
# This file describes the running EXAMPLE, a key-value store. Students do
# not implement it: replace it with your own service, keeping the structure:
#   * every operation has an operationId  -> becomes a Go method name
#   * reusable pieces live in components (schemas, parameters, responses)
#   * reads take a `consistency` query parameter
#   * errors are application/problem+json (RFC 9457)
# ---------------------------------------------------------------------------
# API for the card game 41.
# Part II reads select public fields; consistency options are deferred.
info:
  title: Replicated 41 Card Game
  version: 2.0.0
  description: 'Four players, seats 0-3 increasing to the right; opposite seats are teammates.

    The creator sits at 0 and is the first dealer. Membership is fixed after the first deal starts.

    The dealer explicitly starts each deal. The server randomly shuffles all 52 cards, with no jokers,

    and deals one card per player per cycle, beginning to the dealer''s right. There is no cutting step.

    Bids run right from the dealer, 2-13 except 6. Minimum bids by score: below 30 -> 2;

    30-39 -> 3; 40-49 -> 4; 50-69 -> 5; 70-79 -> 7; then 8,9,10,11,12 in successive tens;

    130 or above -> 13. Bids 7-13 are worth twice their amount.

    A total below 11 skips the deal without scoring and moves the dealer right; the new dealer starts
    again.

    The dealer leads the first trick; each winner leads the next. Follow the leading suit when possible;

    otherwise any card is allowed. The highest heart wins; without hearts, the highest leading-suit card
    wins.

    Ranks increase 2 through A. Hearts may lead any trick.

    After 13 tricks all scores update together: meeting/exceeding a bid adds its points; otherwise subtract.

    Scores may be negative. Exactly one team having a player at 41 or above wins.

    If both teams qualify, it is a draw for now and play continues. Otherwise continue until a team wins.

    Every read and write goes through one executor. An entire batch is one atomic command.

    GetGames serves single and multiple reads; FieldMask selects public sections. IDs are always included.

    GetHand streams metadata, cards, and a final fin message; GetGames also ends with fin.

    REST buffers streams before returning success. No fin means HTTP 503.

    Hands and deck order are absent from public snapshots. Clients are trusted to use their own player
    IDs.

    State is in memory. Startup restores a prototext snapshot or starts empty; there is no automatic persistence.

    A timeout after enqueue does not establish whether a write executed. Writes are not automatically
    retried.'
servers:
- url: /v1
  description: This server
- url: http://localhost:8080/v1
  description: Node n1 from external API tools
tags:
- name: games
  description: Games, participants, deals and atomic actions
paths:
  /games:
    get:
      operationId: getGames
      summary: Read selected games atomically, in request order
      tags:
      - games
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamesResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '504':
          $ref: '#/components/responses/Error504'
      parameters:
      - $ref: '#/components/parameters/GameIds'
      - $ref: '#/components/parameters/Fields'
    post:
      operationId: createGame
      summary: Create a distinct game; creator sits at seat 0
      tags:
      - games
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '504':
          $ref: '#/components/responses/Error504'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameBody'
      description: Names are display labels and may repeat. The state machine allocates a unique game
        ID and creator ID. The default limit is 1000 games; the initial snapshot can set a different positive
        gameLimit. Capacity failure leaves IDs unchanged.
    patch:
      operationId: applyBatch
      summary: Apply 1-100 game actions atomically, in order
      tags:
      - games
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '504':
          $ref: '#/components/responses/Error504'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchBody'
      description: One command for the entire batch. If any action fails, none of its changes or ID allocations
        are kept. Later actions see earlier effects. Clients cannot supply a shuffled deck, scores or
        hands.
  /games/{gameId}:
    parameters:
    - $ref: '#/components/parameters/GameId'
    get:
      operationId: getGame
      summary: Read one game using the GetGames RPC
      tags:
      - games
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameReadResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '504':
          $ref: '#/components/responses/Error504'
      parameters:
      - $ref: '#/components/parameters/Fields'
  /games/{gameId}/players:
    parameters:
    - $ref: '#/components/parameters/GameId'
    post:
      operationId: joinGame
      summary: Join an empty seat before the first deal
      tags:
      - games
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '504':
          $ref: '#/components/responses/Error504'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinGameBody'
  /games/{gameId}/deals:
    parameters:
    - $ref: '#/components/parameters/GameId'
    post:
      operationId: startDeal
      summary: Dealer starts a random deal, immediately ready for bidding
      tags:
      - games
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '412':
          $ref: '#/components/responses/Error412'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '504':
          $ref: '#/components/responses/Error504'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartDealBody'
  /games/{gameId}/deals/{dealNumber}/bids:
    parameters:
    - $ref: '#/components/parameters/GameId'
    - $ref: '#/components/parameters/DealNumber'
    post:
      operationId: placeBid
      summary: Record a bid; resolve bidding after the fourth bid
      tags:
      - games
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '412':
          $ref: '#/components/responses/Error412'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '504':
          $ref: '#/components/responses/Error504'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceBidBody'
  /games/{gameId}/deals/{dealNumber}/plays:
    parameters:
    - $ref: '#/components/parameters/GameId'
    - $ref: '#/components/parameters/DealNumber'
    post:
      operationId: playCard
      summary: Play a legal card; resolve tricks and scoring automatically
      tags:
      - games
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '412':
          $ref: '#/components/responses/Error412'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '504':
          $ref: '#/components/responses/Error504'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayCardBody'
  /games/{gameId}/players/{playerId}/hand:
    parameters:
    - $ref: '#/components/parameters/GameId'
    - $ref: '#/components/parameters/PlayerId'
    get:
      operationId: getHand
      summary: Read remaining cards from the current or most recent deal
      tags:
      - games
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '412':
          $ref: '#/components/responses/Error412'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '504':
          $ref: '#/components/responses/Error504'
components:
  parameters:
    GameIds:
      name: ids
      in: query
      required: true
      description: Nonempty, distinct game IDs, repeated in the desired result order
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          minLength: 1
        maxItems: 100
    GameId:
      name: gameId
      in: path
      required: true
      description: Server-assigned game identifier
      schema:
        type: string
        minLength: 1
    PlayerId:
      name: playerId
      in: path
      required: true
      description: Server-assigned participant identifier
      schema:
        type: string
        minLength: 1
    DealNumber:
      name: dealNumber
      in: path
      required: true
      description: Deal number within the game; skipped deals are counted
      schema:
        type: integer
        format: int64
        minimum: 1
    Fields:
      name: fields
      in: query
      required: false
      description: 'Comma-separated top-level public fields: id, phase, dealerSeat, players, draw, currentDeal,
        winnerTeam. Omit for all fields. id is always included. Empty or unknown paths return 400. Converted
        to google.protobuf.FieldMask.'
      schema:
        type: string
        minLength: 1
      example: phase,players
  responses:
    Error400:
      description: Invalid JSON, parameter, name, seat, mask, bid, card, or batch; INVALID_ARGUMENT.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error404:
      description: Game, participant, or requested current deal does not exist; NOT_FOUND.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error409:
      description: Requested seat is occupied; ALREADY_EXISTS.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error412:
      description: The phase, turn, actor, minimum bid or following-suit rule prevents the action; FAILED_PRECONDITION.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error500:
      description: Unexpected internal failure or malformed upstream reply.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error503:
      description: Game/ID/score capacity exhausted, executor stopped, upstream unavailable, or stream
        ended without fin.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error504:
      description: The request deadline expired.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Seat:
      type: integer
      format: int32
      enum:
      - 0
      - 1
      - 2
      - 3
      description: Seats increase to the right; opposite seats differ by 2
    Team:
      type: integer
      format: int32
      enum:
      - 0
      - 1
      description: Team 0 has seats 0 and 2; team 1 has seats 1 and 3
    BidAmount:
      type: integer
      format: int32
      enum:
      - 2
      - 3
      - 4
      - 5
      - 7
      - 8
      - 9
      - 10
      - 11
      - 12
      - 13
      description: Bid in tricks; the player's current score may impose a higher minimum
    Card:
      type: string
      pattern: ^([2-9]|10|J|Q|K|A)[CDSH]$
      description: Rank followed by suit; hearts are always trump; no jokers
      example: 10H
    CreateGameBody:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          description: Display name of the creator, who occupies seat 0
          example: Kareem
          maxLength: 80
      additionalProperties: false
    JoinGameBody:
      type: object
      required:
      - name
      - seat
      properties:
        name:
          type: string
          minLength: 1
          description: Display name of the joining player
          example: Player Two
          maxLength: 80
        seat:
          $ref: '#/components/schemas/Seat'
      additionalProperties: false
    StartDealBody:
      type: object
      required:
      - playerId
      properties:
        playerId:
          type: string
          minLength: 1
          description: Acting participant; must be the current dealer
          example: player-0
      additionalProperties: false
    PlaceBidBody:
      type: object
      required:
      - playerId
      - amount
      properties:
        playerId:
          type: string
          minLength: 1
          description: Acting participant; must be next in the bidding order
          example: player-0
        amount:
          $ref: '#/components/schemas/BidAmount'
      additionalProperties: false
    PlayCardBody:
      type: object
      required:
      - playerId
      - card
      properties:
        playerId:
          type: string
          minLength: 1
          description: Acting participant; must be next to play
          example: player-0
        card:
          $ref: '#/components/schemas/Card'
      additionalProperties: false
    GamesResponse:
      type: object
      required:
      - games
      - nodeId
      properties:
        games:
          type: array
          minItems: 1
          description: Public game snapshots in the same order as the requested IDs
          items:
            $ref: '#/components/schemas/GameView'
          maxItems: 100
        nodeId:
          type: string
          description: Identity of the gRPC node that produced every snapshot in this batch
          example: n1
    GameResponse:
      type: object
      required:
      - game
      - nodeId
      properties:
        game:
          $ref: '#/components/schemas/Game'
        nodeId:
          type: string
          description: Identity of the gRPC node producing this response, including when REST forwards
            to it
          example: n1
    Game:
      type: object
      required:
      - id
      - phase
      - dealerSeat
      - players
      - draw
      properties:
        id:
          type: string
          description: Server-assigned game identifier
          example: game-1
        phase:
          $ref: '#/components/schemas/GamePhase'
        dealerSeat:
          $ref: '#/components/schemas/Seat'
        players:
          type: array
          minItems: 1
          maxItems: 4
          description: Joined participants ordered by seat, with unique seats and IDs
          items:
            $ref: '#/components/schemas/Player'
        draw:
          type: boolean
          description: Both teams qualified after the latest completed deal; continue playing while true
          example: false
        currentDeal:
          $ref: '#/components/schemas/Deal'
        winnerTeam:
          $ref: '#/components/schemas/Team'
      description: 'Public state. currentDeal is omitted until the first deal is created

        and otherwise retains the current or most recent deal. winnerTeam is

        present only in phase finished. dealerSeat identifies the active

        dealer during a deal and the next dealer in phase ready.

        A phase-finished game accepts no more state-changing operations.

        '
    Player:
      type: object
      required:
      - id
      - name
      - seat
      - team
      - score
      - minimumBid
      properties:
        id:
          type: string
          example: player-1
        name:
          type: string
          example: Kareem
        seat:
          $ref: '#/components/schemas/Seat'
        team:
          $ref: '#/components/schemas/Team'
        score:
          type: integer
          format: int64
          description: Cumulative signed score; negative totals are allowed
          example: -4
        minimumBid:
          $ref: '#/components/schemas/BidAmount'
    Deal:
      type: object
      required:
      - number
      - status
      - dealerSeat
      - bids
      - playerStates
      - completedTricks
      properties:
        number:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          enum:
          - bidding
          - playing
          - skipped
          - completed
        dealerSeat:
          $ref: '#/components/schemas/Seat'
        nextSeat:
          $ref: '#/components/schemas/Seat'
        bids:
          type: array
          minItems: 0
          maxItems: 4
          description: Public bids in submission order, beginning with the dealer
          items:
            $ref: '#/components/schemas/Bid'
        playerStates:
          type: array
          minItems: 4
          maxItems: 4
          description: One entry per seat in seat order
          items:
            $ref: '#/components/schemas/DealPlayerState'
        completedTricks:
          type: integer
          format: int32
          minimum: 0
          maximum: 13
        currentTrick:
          $ref: '#/components/schemas/Trick'
        lastTrick:
          $ref: '#/components/schemas/Trick'
      description: Current or most recent deal. nextSeat is absent after a skipped/completed deal. A resolved
        lastTrick is retained. Starting another deal requires the next dealer's request.
    DealPlayerState:
      type: object
      required:
      - playerId
      - cardsRemaining
      - tricksWon
      properties:
        playerId:
          type: string
        cardsRemaining:
          type: integer
          format: int32
          minimum: 0
          maximum: 13
        tricksWon:
          type: integer
          format: int32
          minimum: 0
          maximum: 13
    Bid:
      type: object
      required:
      - playerId
      - amount
      - points
      properties:
        playerId:
          type: string
        amount:
          $ref: '#/components/schemas/BidAmount'
        points:
          type: integer
          format: int32
          enum:
          - 2
          - 3
          - 4
          - 5
          - 14
          - 16
          - 18
          - 20
          - 22
          - 24
          - 26
          description: Amount for bids 2-5, twice the amount for bids 7-13; added on success or subtracted
            on failure
    Trick:
      type: object
      required:
      - number
      - leaderSeat
      - plays
      properties:
        number:
          type: integer
          format: int32
          minimum: 1
          maximum: 13
        leaderSeat:
          $ref: '#/components/schemas/Seat'
        plays:
          type: array
          minItems: 0
          maxItems: 4
          description: Public plays in turn order; the first card determines the leading suit
          items:
            $ref: '#/components/schemas/CardPlay'
        winnerSeat:
          $ref: '#/components/schemas/Seat'
      description: winnerSeat is present only for a resolved trick with exactly four plays
    CardPlay:
      type: object
      required:
      - playerId
      - card
      properties:
        playerId:
          type: string
        card:
          $ref: '#/components/schemas/Card'
    HandResponse:
      type: object
      required:
      - gameId
      - dealNumber
      - playerId
      - cards
      - nodeId
      properties:
        gameId:
          type: string
          example: game-1
        dealNumber:
          type: integer
          format: int64
          minimum: 1
        playerId:
          type: string
          example: player-0
        cards:
          type: array
          minItems: 0
          maxItems: 13
          uniqueItems: true
          description: Remaining cards sorted by suit C, D, S, H and rank ascending; empty is an empty
            array
          items:
            $ref: '#/components/schemas/Card'
          example:
          - 2C
          - AC
          - 10H
        nodeId:
          type: string
          description: Identity of the gRPC node producing the hand response
          example: n1
    Problem:
      type: object
      required:
      - title
      - status
      properties:
        type:
          type: string
          default: about:blank
          description: Problem type URI; about:blank uses the HTTP status meaning
        title:
          type: string
          description: Short summary of the HTTP error
          example: Precondition Failed
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          example: 412
        detail:
          type: string
          description: Explanation specific to this failed request
          example: Player at seat 1 cannot play while nextSeat is 0.
    GamePhase:
      type: string
      enum:
      - waiting
      - ready
      - bidding
      - playing
      - finished
    GameView:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: Server-assigned game identifier
          example: game-1
        phase:
          $ref: '#/components/schemas/GamePhase'
        dealerSeat:
          $ref: '#/components/schemas/Seat'
        players:
          type: array
          minItems: 1
          maxItems: 4
          description: Joined participants ordered by seat, with unique seats and IDs
          items:
            $ref: '#/components/schemas/Player'
        draw:
          type: boolean
          description: Both teams qualified after the latest completed deal; continue playing while true
          example: false
        currentDeal:
          $ref: '#/components/schemas/Deal'
        winnerTeam:
          $ref: '#/components/schemas/Team'
      description: Selected public fields. id is always included. An omitted fields parameter returns
        every public section; optional currentDeal and winnerTeam remain absent when inapplicable.
    GameReadResponse:
      type: object
      required:
      - game
      - nodeId
      properties:
        game:
          $ref: '#/components/schemas/GameView'
        nodeId:
          type: string
    BidActionBody:
      type: object
      additionalProperties: false
      required:
      - playerId
      - dealNumber
      - amount
      properties:
        playerId:
          type: string
          minLength: 1
        dealNumber:
          type: integer
          format: int64
          minimum: 1
        amount:
          $ref: '#/components/schemas/BidAmount'
    PlayActionBody:
      type: object
      additionalProperties: false
      required:
      - playerId
      - dealNumber
      - card
      properties:
        playerId:
          type: string
          minLength: 1
        dealNumber:
          type: integer
          format: int64
          minimum: 1
        card:
          $ref: '#/components/schemas/Card'
    ActionBody:
      type: object
      additionalProperties: false
      required:
      - gameId
      minProperties: 2
      maxProperties: 2
      description: gameId and exactly one of join, startDeal, bid, play.
      properties:
        gameId:
          type: string
          minLength: 1
        join:
          $ref: '#/components/schemas/JoinGameBody'
        startDeal:
          $ref: '#/components/schemas/StartDealBody'
        bid:
          $ref: '#/components/schemas/BidActionBody'
        play:
          $ref: '#/components/schemas/PlayActionBody'
    BatchBody:
      type: object
      additionalProperties: false
      required:
      - actions
      properties:
        actions:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ActionBody'
    BatchResponse:
      type: object
      required:
      - games
      - nodeId
      properties:
        games:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Game'
          description: Snapshot immediately after each action, in action order. Later actions see earlier
